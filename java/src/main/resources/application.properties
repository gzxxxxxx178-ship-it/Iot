spring.application.name=IoTSystem

# Profiles must be selected explicitly: --spring.profiles.active=dev|test|prod
spring.profiles.default=none

# Server
server.address=0.0.0.0
server.port=8080

# Database (production values are supplied by application-prod.properties/environment)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/iot?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# 禁止视图渲染阶段隐式触发数据库查询，避免延迟加载掩盖N+1问题。
spring.jpa.open-in-view=false

# Schema changes are managed by Flyway in production; tests explicitly disable it.
spring.flyway.enabled=false

# 微信小程序登录配置由本机环境变量提供，AppSecret不写入仓库或客户端。
wechat.miniapp.app-id=${WECHAT_MINIAPP_APP_ID:}
wechat.miniapp.app-secret=${WECHAT_MINIAPP_APP_SECRET:}

# Redis (Spring Boot 2.7；starter 默认使用 Lettuce)
spring.redis.client-type=lettuce
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.timeout=2000ms
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-wait=-1ms
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0

# DeepSeek AI (key supplied by profile/environment)
deepseek.api.key=${DEEPSEEK_API_KEY:}
deepseek.api.url=https://api.deepseek.com/v1/chat/completions
deepseek.api.connect-timeout-ms=${DEEPSEEK_CONNECT_TIMEOUT_MS:3000}
deepseek.api.read-timeout-ms=${DEEPSEEK_READ_TIMEOUT_MS:30000}

jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

# Google OAuth2 (credentials overridden by profile)
app.oauth2.google.enabled=${GOOGLE_OAUTH_ENABLED:true}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile

# OAuth2 redirect after login
app.oauth2.redirect-uri=http://localhost:5173

# Alipay Sandbox (keys supplied by profile/environment)
alipay.app-id=${ALIPAY_APP_ID:}
alipay.private-key=${ALIPAY_PRIVATE_KEY:}
alipay.alipay-public-key=${ALIPAY_PUBLIC_KEY:}
alipay.gateway=https://openapi-sandbox.dl.alipaydev.com/gateway.do
alipay.notify-url=${ALIPAY_NOTIFY_URL:http://localhost:8080/api/alipay/notify}

# Dashboard device online threshold (seconds)
dashboard.device-online-timeout-seconds=30

# WebSocket security: comma-separated browser origins and one-time ticket lifetime
websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173,https://servicewechat.com}
websocket.ticket-ttl-seconds=30

# Browser security boundaries
web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://servicewechat.com}
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
auth.cookie.same-site=${AUTH_COOKIE_SAMESITE:Lax}

# Swagger is enabled only by the explicit dev profile.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# MQTT TLS connection (credentials must be supplied by an ignored profile or environment)
mqtt.broker=${MQTT_BROKER:ssl://node.61153652.xyz:8883}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}
mqtt.topic-root=agri
mqtt.client-id-prefix=iot-backend
mqtt.connection-timeout-seconds=10
mqtt.keep-alive-seconds=30
mqtt.initial-reconnect-delay-seconds=1
mqtt.max-reconnect-delay-seconds=60
device.command.timeout-seconds=${DEVICE_COMMAND_TIMEOUT_SECONDS:60}
device.command.timeout-scan-interval-ms=${DEVICE_COMMAND_TIMEOUT_SCAN_INTERVAL_MS:10000}

# Sensor history governance
sensor.history.retention-enabled=${SENSOR_HISTORY_RETENTION_ENABLED:true}
sensor.history.retention-days=${SENSOR_HISTORY_RETENTION_DAYS:365}
sensor.history.cleanup-cron=${SENSOR_HISTORY_CLEANUP_CRON:0 30 3 * * *}
